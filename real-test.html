<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<link rel="stylesheet" href="style.css?v=3"/></head>
<body>
<div id="player-modal" class="modal" style="display:flex">
  <div id="modal-backdrop"></div>
  <div class="modal-box player-modal-box">
    <div class="player-topbar">
      <button id="btn-modal-close" class="modal-close" aria-label="Fechar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <span class="player-topbar-title" id="player-topbar-title">Teste</span>
      <button id="btn-cast" class="player-mirror-btn" style="display:none" aria-label="Transmitir">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5A12.5 12.5 0 0 1 14.5 21"/><path d="M2 13a8 8 0 0 1 8 8"/><circle cx="2" cy="21" r="1"/></svg>
      </button>
    </div>
    <div class="player-stage" id="player-stage">
      <video id="video-el" playsinline></video>
      <div class="player-overlay">
        <button id="btn-center-play" class="player-center-play" aria-label="Reproduzir">
          <svg id="icon-play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
        </button>
        <div class="player-controls">
          <div id="player-progress" class="player-progress" role="slider" aria-label="Progresso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="player-progress-fill" class="player-progress-fill"></div>
          </div>
          <div class="player-controls-row">
            <span id="player-time" class="player-time">0 / 0</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let hls = null;
const v = $('video-el');
const log = document.createElement('pre'); log.style.cssText='position:fixed;left:0;bottom:0;z-index:9;background:#000;color:#0f0;font:10px monospace;max-height:40vh;overflow:auto;'; document.body.appendChild(log);
const L = m => { const t = new Date().toISOString().slice(11,19); log.textContent = `${t} ${m}\n${log.textContent}`.split('\n').slice(0,40).join('\n'); };

function isFiniteD(s){ return typeof s==='number' && isFinite(s); }

function getPlayerDuration() {
  if (isFiniteD(v.duration) && v.duration > 0) return v.duration;
  if (hls && hls.levels && hls.levels[0] && hls.levels[0].details) {
    const d = hls.levels[0].details;
    if (!d.live && d.totalduration > 0) return d.totalduration;
  }
  if (v.seekable && v.seekable.length && isFinite(v.seekable.end(v.seekable.length-1)))
    return v.seekable.end(v.seekable.length-1);
  return 0;
}

let lastPct = -1;
function updatePlayerUI() {
  const dur = getPlayerDuration();
  const pct = dur ? Math.min(100, (v.currentTime/dur)*100) : 0;
  $('player-progress-fill').style.width = `${pct}%`;
  $('player-time').textContent = `${v.currentTime.toFixed(0)} / ${dur.toFixed(0)}  dur=${v.duration}  pct=${pct.toFixed(1)}%`;
  lastPct = pct;
}

const STREAM = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';
if (Hls.isSupported()) {
  hls = new Hls();
  hls.loadSource(STREAM);
  hls.attachMedia(v);
  hls.on(Hls.Events.MANIFEST_PARSED, () => L('MANIFEST levels=' + hls.levels.length));
  hls.on(Hls.Events.LEVEL_LOADED, (e,d) => L(`LEVEL live=${d.details.live} total=${d.details.totalduration.toFixed(0)} v.duration=${v.duration}`));
  hls.on(Hls.Events.ERROR, (e,d) => L('ERR ' + d.type + ' ' + (d.fatal||'')));
}
v.addEventListener('timeupdate', () => { updatePlayerUI(); L(`tu cur=${v.currentTime.toFixed(1)} pdur=${getPlayerDuration().toFixed(0)} fill=${$('player-progress-fill').style.width}`); });
v.addEventListener('durationchange', () => L('DURCHANGE ' + v.duration));
v.addEventListener('loadedmetadata', () => L('LMETADATA dur=' + v.duration));
v.addEventListener('play', () => { v.play().catch(e=>L('play! '+e.message)); });
setInterval(updatePlayerUI, 400);
</script>
</body></html>
