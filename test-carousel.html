<!DOCTYPE html>
<html>
<head>
<style>
html, body { height: 100%; overflow-x: clip; background: #111; color: #fff; }

.carousel-track {
  display: flex;
  flex-direction: row;
  gap: 12px;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-x;
  padding: 8px 24px;
}
.card {
  flex: none;
  width: 150px;
  height: 220px;
  background: #e50914;
  border-radius: 8px;
}
</style>
</head>
<body>
<div class="carousel-track">
  <div class="card"></div><div class="card"></div><div class="card"></div>
  <div class="card"></div><div class="card"></div><div class="card"></div>
  <div class="card"></div><div class="card"></div><div class="card"></div>
  <div class="card"></div><div class="card"></div><div class="card"></div>
</div>
</body>
</html>
